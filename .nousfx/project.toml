# The gate runs this command itself before it records a review (docs/review-gate.md, "The check command").
# It is read from the default branch, so a branch cannot change it for its own PR.
[check]
command = "python3 -B scripts/run_checks.py"
timeout = 1800

# Files that control the review itself. Read from the default branch like [check] (review-loop tier script, NFX-62).
[review]
risk_paths = ["claude/hooks", "claude/githooks", "claude/skills/review-loop", "harness", "scripts", ".nousfx", "install.sh", "install.ps1"]
