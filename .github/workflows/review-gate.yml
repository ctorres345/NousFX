name: review-gate

# Server-side check of the review gate (docs/review-gate.md). The PR must carry a
# `Review-Gate: <tree hash>` line (from `review-gate.py attest`) for the tree of its head commit.
# The gate script is taken from the BASE branch, never from the PR, so a PR cannot edit it to pass.
# After the attestation, the project's check command (.nousfx/project.toml on the BASE branch) runs on the
# PR head, so a failing test fails this job even when the PR body holds a valid line.
# Before that check, the base branch's tier.py recomputes the review tier on the diff, and the job fails when
# the body's Review-Tier line is lower (NFX-70).
# Marking this check "required" in the repo settings is a manual step.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify the review attestation with the base branch's gate
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: |
          set -eu
          gate_dir="$RUNNER_TEMP/gate"
          mkdir -p "$gate_dir"
          if ! git show "origin/$BASE_REF:claude/hooks/review-gate.py" > "$gate_dir/review-gate.py" 2>/dev/null \
             || ! git show "origin/$BASE_REF:claude/hooks/pr_create_parser.py" > "$gate_dir/pr_create_parser.py" 2>/dev/null; then
            echo "::error::The base branch '$BASE_REF' has no review gate yet (claude/hooks/review-gate.py). The first PR that introduces the gate cannot be verified; merge it by hand as the repo owner."
            exit 1
          fi
          if ! grep -q "verify-attestation" "$gate_dir/review-gate.py"; then
            echo "::error::The gate on '$BASE_REF' predates attestations (no verify-attestation). The PR that introduces them cannot be verified; merge it by hand as the repo owner."
            exit 1
          fi
          if ! grep -q 'sys.argv\[1:2\] == \["run-check"\]' "$gate_dir/review-gate.py"; then
            echo "::error::The gate on '$BASE_REF' cannot run the project's check command (no run-check). The PR that introduces it cannot be verified; merge it by hand as the repo owner."
            exit 1
          fi
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"
          git log -1 --format=%B HEAD > "$RUNNER_TEMP/commit-msg.txt"
          tree=$(git rev-parse 'HEAD^{tree}')
          out=$(python3 -B "$gate_dir/review-gate.py" verify-attestation --tree "$tree" \
                  --text-file "$RUNNER_TEMP/pr-body.txt" --text-file "$RUNNER_TEMP/commit-msg.txt" </dev/null) || {
            echo "::error::No valid Review-Gate line for tree $tree in the PR description or last commit message. Run 'review-gate.py attest' on the final code and paste the line into the PR body."
            exit 1
          }
          echo "$out"
          case "$out" in
            *"Review attestation found for tree $tree."*) ;;
            *) echo "::error::The base gate did not confirm the attestation."; exit 1 ;;
          esac
          # The tier check (NFX-70) runs before the slow check command, with the same base copies plus tier.py.
          if ! git show "origin/$BASE_REF:claude/skills/review-loop/scripts/tier.py" > "$gate_dir/tier.py" 2>/dev/null \
             || ! grep -q 'sys.argv\[1:2\] == \["verify-tier"\]' "$gate_dir/review-gate.py"; then
            echo "::error::The base branch '$BASE_REF' has no tier.py, or its gate cannot check the review tier (no verify-tier). The PR that introduces them cannot be verified; merge it by hand as the repo owner."
            exit 1
          fi
          base=$(git merge-base "origin/$BASE_REF" HEAD) || { echo "::error::No merge base between origin/$BASE_REF and the PR head."; exit 1; }
          # The diff only, no labels: labels live in Jira, which CI does not read.
          python3 -B "$gate_dir/tier.py" --base "$base" --cwd "$GITHUB_WORKSPACE" </dev/null > "$RUNNER_TEMP/tier.json" || {
            echo "::error::tier.py from '$BASE_REF' failed on this PR's diff."
            exit 1
          }
          cat "$RUNNER_TEMP/tier.json"
          if ! grep -q -- '--author-association' "$gate_dir/review-gate.py"; then
            echo "::warning::The gate on '$BASE_REF' predates NFX-95: it honors a Review-Tier override from any PR author."
          fi
          tier_out=$(python3 -B "$gate_dir/review-gate.py" verify-tier --tier-json "$RUNNER_TEMP/tier.json" \
                       --text-file "$RUNNER_TEMP/pr-body.txt" --author-association "$AUTHOR_ASSOCIATION" </dev/null 2>&1) || {
            printf '%s\n' "$tier_out"
            echo "::error::The review tier check failed (message above): a Review-Tier line below the computed tier, or one it cannot read."
            exit 1
          }
          printf '%s\n' "$tier_out"
          case "$tier_out" in
            *"Review tier checked."*) ;;
            *) echo "::error::The base gate did not confirm the tier check."; exit 1 ;;
          esac
          # A skip attestation waives the review, never the tests: the check always runs.
          check_out=$(python3 -B "$gate_dir/review-gate.py" run-check --ref "origin/$BASE_REF" </dev/null) || {
            printf '%s\n' "$check_out"
            echo "::error::The project's check command did not pass (command and output above)."
            exit 1
          }
          printf '%s\n' "$check_out"
          case "$check_out" in
            *"Check passed."*) ;;
            *) echo "::error::The base gate did not confirm that the check ran."; exit 1 ;;
          esac
